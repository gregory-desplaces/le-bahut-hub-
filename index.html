<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Bahut — Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-main">Le Bahut</span>
    <span class="brand-accent">Hub</span>
  </div>
  <div class="today" id="today-label"></div>
</header>

<main>

  <section class="quicklinks" id="quicklinks">
    <!-- rempli par script.js -->
  </section>

  <section class="card today-card">
    <div class="card-head">
      <h2>Aujourd'hui</h2>
      <span class="hint">Le support de présentation reçu le soir sur Discord</span>
    </div>
    <div class="today-form">
      <input type="url" id="support-input" placeholder="Colle ici le lien du support du jour…">
      <button id="support-save" class="btn btn-primary">Enregistrer</button>
      <a href="#" id="support-open" class="btn btn-ghost" target="_blank" rel="noopener">Ouvrir ↗</a>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Mes cours</h2>
      <button id="add-toggle" class="btn btn-primary">+ Ajouter un lien</button>
    </div>

    <form id="add-form" class="add-form hidden">
      <input type="text" id="f-titre" placeholder="Titre du cours" required>
      <input type="url" id="f-url" placeholder="https://…" required>
      <select id="f-source">
        <option>Gamma</option>
        <option>Lovable</option>
        <option>Arc</option>
        <option>Drive</option>
        <option>Notion</option>
        <option>Autre</option>
      </select>
      <input type="text" id="f-note" placeholder="Note (optionnel)">
      <div class="add-form-actions">
        <button type="submit" class="btn btn-primary">Ajouter</button>
        <button type="button" id="add-cancel" class="btn btn-ghost">Annuler</button>
      </div>
    </form>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Rechercher un cours…">
      <div class="filters" id="filters"></div>
    </div>

    <div class="grid" id="liens-grid"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Catalogue complet des cours</h2>
      <a href="https://airtable.com/appM30dA0qwJqxOwh/shrnHpWCaHhG2HBcq/tbl6WTrSjatY7Hw0o" target="_blank" rel="noopener" class="btn btn-ghost">Ouvrir dans Airtable ↗</a>
    </div>
    <iframe class="airtable-embed"
      src="https://airtable.com/embed/appM30dA0qwJqxOwh/shrnHpWCaHhG2HBcq/tbl6WTrSjatY7Hw0o"
      frameborder="0" width="100%" height="520"></iframe>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
